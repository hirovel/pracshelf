[project]
name = "pracshelf"
version = "0.1.0"
description = "PracShelf: a local workbench for AI practice articles and personal notes"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "feedparser>=6.0,<7",
    "trafilatura>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=1,<2",
    "markdown-it-py>=3,<5",
    "langchain-core>=1,<2",
    "openai-codex==0.162.1",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek>=1.1.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
collect = "learning_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

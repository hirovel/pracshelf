<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史搜索实验</title><style>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.8 system-ui;color:#213c39;background:#f4f6f3}a{color:#286956}article{background:white;border:1px solid #dbe3dc;border-radius:10px;padding:20px;margin:16px 0}small{color:#64776b}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto;font-size:13px}#error{color:#a3312c}</style></head><body>
<a href="/">← 返回资料与笔记</a><h1>历史搜索实验</h1><p>保留当时的查询、返回、比较和选材记录。早先“只保留 Codex”的路线判断已撤回，以下记录不决定当前管线，也不代表公平的质量排名。</p><p>这里仅供查看。新资料请从<a href="/candidates">收集与初筛</a>添加。</p><div id="error" role="alert"></div><div id="reports"></div><div id="runs"></div>
<script>
async function get(path){const r=await fetch(path);if(!r.ok)throw new Error(await r.text());return r.json()}
function record(parent,title,path,data){const box=document.createElement('article'),h=document.createElement('h2'),a=document.createElement('a'),d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');h.textContent=title;a.href=path;a.textContent='单独查看 JSON';a.target='_blank';a.rel='noopener';s.textContent='展开保存的记录';p.textContent=JSON.stringify(data,null,2);d.append(s,p);box.append(h,a,d);document.getElementById(parent).append(box)}
Promise.all([get('/api/comparisons/latest'),get('/api/experiments'),get('/api/discovery')]).then(([report,runs,selections])=>{if(report)record('reports','当时的比较快照（已撤回路线决策）','/api/comparisons/'+report.id,report);if(selections.length)record('reports','历史选材与时效判断','/api/discovery',selections);for(const run of runs)record('runs',run.plan.goal+' · '+run.id.slice(0,8),'/api/experiments/'+run.id,run)}).catch(e=>document.getElementById('error').textContent=e.message);
</script></body></html>
